services:
  - type: web
    name: commercesuite-backend
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    # The free plan has no persistent disk. SQLite lives on the instance's
    # ephemeral filesystem and is re-seeded on boot, so demo data resets on
    # every deploy or restart.
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://commercesuite-demo.vercel.app
